<div class="card">
  <div class="card-body">
    <div class="table-responsive">
      <table class="table table-bordered">
        <thead>
          <tr>
            <th>Sr.no</th>
            <th>Employee Name</th>
            <th>Salary</th>
            <th>Is Active</th>
            <th>Edit</th>
            <th>Delete</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let emp of getAllemployee; let i = index ; trackBy : trackByFun">
            <td>{{ i + 1 }}</td>
            <td>{{ emp.empName }}</td>
            <td>{{ emp.empSalary }}</td>
            <td>{{ emp.isActive ? 'Yes' :'No' }}</td>
            <td><button class="btn btn-sm btn-primary">Edit</button></td>
            <td><button class="btn btn-sm btn-danger">Delete</button></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
